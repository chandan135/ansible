---
- name: Update apt cache
  apt:
    update_cache: yes
    cache_valid_time: 3600

- name: Install PostgreSQL
  apt:
    name:
      - postgresql
      - postgresql-contrib
    state: present

- name: Enable PostgreSQL
  systemd:
    name: postgresql
    enabled: yes

- name: Start PostgreSQL
  systemd:
    name: postgresql
    state: started
...
